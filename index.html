<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema di Ornella</title>
  <link rel="stylesheet" href="style.css">
  <script src="dist/main.js" defer></script>
</head>
<body>
  <h1>Cinema di Ornella</h1>

  <form id="form-vendita">
    <label for="nome">Nome del cliente</label>
    <input type="text" id="nome">

    <label for="biglietti">Numero di biglietti (max 8)</label>
    <input type="number" id="biglietti" min="1" max="8" value="1">

     <fieldset>
      <legend>Tipo di biglietto</legend>
      <label><input type="radio" id="intero" name="tipo" value="intero" checked> Intero (8,50 €)</label>
      <label><input type="radio" id="ridotto" name="tipo" value="ridotto"> Ridotto: under 12 e over 65 (6,00 €)</label>
    </fieldset>

    <label for="film">Film</label>
    <select id="film">
      <option value="1">Il ritorno del drago</option>
      <option value="2">Risate in famiglia</option>
      <option value="3">Pianeta rosso</option>
      <option value="4">La casa nel bosco</option>
    </select>

    <fieldset>
      <legend>Extra</legend>
      <label><input type="checkbox" id="popcorn"> Popcorn (4,00 €)</label>
      <label><input type="checkbox" id="bibita"> Bibita (2,50 €)</label>
      <label><input type="checkbox" id="occhiali"> Occhiali 3D (1,00 € a biglietto)</label>
    </fieldset>

    <div class="pulsanti">
      <button type="button" id="btnRiepilogo" onclick="mostraRiepilogo()">Riepilogo ordine</button>
      <button type="button" id="btnSintesi" onclick="mostraSintesi()">Sintesi della giornata</button>
    </div>
  </form>

  <div id="risultato"></div>

</body>
</html>
